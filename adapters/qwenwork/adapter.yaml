# MMAB adapter descriptor - 千问办公（qwenwork，策略族 S1：主进程注入）
# 能力状态取自原型验收结论；evidence 是“经平台路径”的最强证据（ADR-0005）。
# 2026-11-09 已在正式实例（千问 2.0.0）上经平台完成界面渲染与历史会话验收（docs/m3-acceptance.md），
# 因此 ui.render / ui.history 为 live；发消息（ui.compose）尚未经平台验收。
schemaVersion: 1
appId: qwenwork
displayName: 千问办公
version: 0.3.0
strategy: electron-main-inject
protocol: { min: "1.0", max: "1.0" }
app:
  bundleId: cn.qwenwork.desktop.mac
  executableAllowlist: [/Applications/QwenWorkCN.app/Contents/MacOS/QwenWorkCN]
  versionSource: Info.plist
  icon: Contents/Resources/icon.icns           # 控制台头像：运行时从本机安装包转换，不入库
permissions:
  launchArguments: true      # 需以 --inspect=127.0.0.1:9229 启动；适配器与注入工具都不会重启应用
  temporaryInspector: true   # tools/inject.mjs 注入后立即关闭
  persistentCdp: false
  fileUploadDir: false       # 附件尚未经平台实现
risk:
  level: medium
  notes:
    - 以真实主窗口身份调用 IPC，与本机窗口共享账号与状态；不是只读沙箱
    - 依赖应用私有 IPC 实现，升级后必须回归
    - 普通方式启动的实例无法安全注入，需操作者确认后重启
capabilities:
  ui.render: SUPPORTED       # 原型：1.3.2 / 2.0.0 原版界面已验收
  ui.history: SUPPORTED      # 原型：2.0.0 历史会话已验收
  ui.compose: UNVERIFIED     # 原型 1.3.2 已验收，2.0.0 未复验
  stream.push: UNVERIFIED
  file.upload: UNSUPPORTED   # 平台路径尚未实现
  file.drop: UNSUPPORTED
  clipboard.write: UNVERIFIED  # 浏览器本地写入，未在平台路径验证
  clipboard.read: UNSUPPORTED
  media.voice: UNVERIFIED
  app.git: UNSUPPORTED
  app.extension: UNVERIFIED
# 全部 IPC 只能粗粒度归入 ui.render：tRPC 内的业务调用（含发消息）在 IPC 层无法逐项区分。
operations:
  qwenwork.bootstrap: { capability: ui.render, kind: request, sync: true }
  qwenwork.invoke: { capability: ui.render, kind: request }
  qwenwork.send: { capability: ui.render, kind: request }
  qwenwork.sendSync: { capability: ui.render, kind: request, sync: true }
  qwenwork.ipc: { capability: ui.render, kind: event }
web:
  inject:
    - platform:codec.js
    - platform:transport.js
    - platform:electron-compat.js
    - adapter:qwen-electron.js
    - resource:/mmab-preload.js
evidence:
  ui.render: live      # 2026-11-09 正式实例：原版界面、desktopApi / electronTRPC、47 个按钮、输入框，0 未处理异常
  ui.history: live     # 2026-11-09 正式实例：打开历史会话，消息列表加载
resources:
  source: extract-from-app-bundle
